# Render の Blueprint。Dashboard の「New > Blueprint」でこのリポジトリを選ぶと作られる。
services:
  - type: web
    name: chainrace
    runtime: docker
    plan: starter # 無料プランは停止とディスクなしのため、記録が消える
    region: singapore
    domains:
      - chainrace.kodking-tools.com
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/tsunagu.db
